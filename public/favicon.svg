<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cafferium">
  <title>Cafferium</title>
  <defs>
    <linearGradient id="cff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b3aa" />
      <stop offset="1" stop-color="#00676d" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#cff-bg)" />

  <!-- Cup handle -->
  <path d="M41.6 30.5h3.4a6.4 6.4 0 0 1 0 12.8h-3.4" fill="none" stroke="#eef4f5" stroke-width="4.4"
    stroke-linecap="round" />

  <!-- Cup body -->
  <path d="M16 26.5h25.6V38a12.8 12.8 0 0 1-12.8 12.8A12.8 12.8 0 0 1 16 38Z" fill="#f7fafb" />

  <!-- Brewed surface -->
  <ellipse cx="28.8" cy="26.5" rx="12.8" ry="3.2" fill="#d4af37" />

  <!-- Saucer -->
