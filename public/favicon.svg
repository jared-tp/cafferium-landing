  <!-- Steam -->
  <g fill="none" stroke="#d4af37" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
    <path d="M23.4 21.4c0-2.8 2.8-2.8 2.8-5.6" />
    <path d="M32.2 21.4c0-2.8 2.8-2.8 2.8-5.6" />
